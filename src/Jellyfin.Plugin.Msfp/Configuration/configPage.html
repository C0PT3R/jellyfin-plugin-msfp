<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MSFP Federation</title>
</head>
<body>
    <div id="MsfpConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h2>MSFP Federation</h2>
                <p>Early, not usable yet.</p>
                <form id="MsfpConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="MsfpAddress">This server's address</label>
                        <input id="MsfpAddress" name="MsfpAddress" type="text" is="emby-input" placeholder="https://media.example.org" />
                        <div class="fieldDescription">Where peers reach this server: http or https, a host and an optional port, no path. Empty: federation is off.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="MsfpServerName">This server's name</label>
                        <input id="MsfpServerName" name="MsfpServerName" type="text" is="emby-input" maxlength="80" />
                        <div class="fieldDescription">The name peers show. Empty: the address's host.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var MsfpConfig = {
                pluginUniqueId: '505184bf-b92c-487f-a406-bf6b3570fb7f'
            };

            document.querySelector('#MsfpConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(MsfpConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#MsfpAddress').value = config.Address || '';
                        document.querySelector('#MsfpServerName').value = config.ServerName || '';
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#MsfpConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(MsfpConfig.pluginUniqueId).then(function (config) {
                        config.Address = document.querySelector('#MsfpAddress').value.trim();
                        config.ServerName = document.querySelector('#MsfpServerName').value.trim();
                        ApiClient.updatePluginConfiguration(MsfpConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
