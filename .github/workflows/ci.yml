# Checks every push and pull request: the build (warnings are errors), the
# tests, the plugin as Jellyfin loads it (the DLLs of build.yaml's
# artifacts), then that plugin in each Jellyfin version it supports
# (jellyfin-check.yml). It builds in the .NET 10 SDK's own image, the same
# one used locally (TECHNICAL.md, Building).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.404
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The migration to MSFP's revised version 0: the plugin builds against
      # msfp-dotnet's branch revision by project reference (../msfp-dotnet)
      # until release day, when it goes back to the published package.
      - name: msfp-dotnet's revision beside
        if: hashFiles('src/Jellyfin.Plugin.Msfp/Jellyfin.Plugin.Msfp.csproj') != '' && contains(github.ref, 'msfp-revision')
        run: git clone --depth 1 --branch revision https://github.com/msfp-io/msfp-dotnet.git ../msfp-dotnet

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Msfp.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.Msfp.slnx --no-restore -c Release

      - name: Tests
        run: dotnet test Jellyfin.Plugin.Msfp.slnx --no-build -c Release

      - name: The plugin
        run: |
          dotnet build src/Jellyfin.Plugin.Msfp --no-restore -c Release -o out
          mkdir plugin
          for f in $(sed -n 's/^- "\(.*\)"$/\1/p' build.yaml); do
            test -f "out/$f" || { echo "out/$f is missing" >&2; exit 1; }
            cp "out/$f" plugin/
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: plugin
          retention-days: 7

  jellyfin:
    needs: check
    uses: ./.github/workflows/jellyfin-check.yml
